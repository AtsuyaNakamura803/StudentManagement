<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>受講生一覧</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f5f5f5; }
        ul { margin: 0; padding-left: 20px; }
    </style>
</head>
<body>
<h1>受講生一覧</h1>

<!-- 新規登録リンク -->
<a th:href="@{/newStudent}">新規登録</a>

<!-- 無効を含めるか選択 -->
<form th:action="@{/studentList}" method="get" style="margin:10px 0;">
    <label>
        <input type="checkbox" name="showAll" th:checked="${showAll}"/> 無効を含めて表示
    </label>
    <button type="submit">更新</button>
</form>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>名前</th>
        <th>カナ名</th>
        <th>ニックネーム</th>
        <th>eメール</th>
        <th>地域</th>
        <th>年齢</th>
        <th>性別</th>
        <th>コース名</th>
        <th>備考</th>
        <th>状態</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="studentDetail : ${studentDetails}">
        <td th:text="${studentDetail.student.id}"></td>
        <td th:text="${studentDetail.student.name}"></td>
        <td th:text="${studentDetail.student.kanaName}"></td>
        <td th:text="${studentDetail.student.nickname}"></td>
        <td th:text="${studentDetail.student.email}"></td>
        <td th:text="${studentDetail.student.area}"></td>
        <td th:text="${studentDetail.student.age}"></td>
        <td th:text="${studentDetail.student.sex}"></td>
        <td>
            <ul>
                <li th:each="course : ${studentDetail.studentsCourses}" th:text="${course.courseName}"></li>
            </ul>
        </td>
        <td th:text="${studentDetail.student.remark}"></td>
        <td th:text="${studentDetail.student.active ? '有効' : '無効'}"></td>
        <td>
            <!-- 有効な場合のみ編集リンク表示 -->
            <a th:if="${studentDetail.student.active}"
               th:href="@{'/editStudent/' + ${studentDetail.student.id}}">編集</a>

            <!-- 無効な場合のみ復活ボタン表示 -->
            <form th:if="${!studentDetail.student.active}"
                  th:action="@{'/restoreStudent/' + ${studentDetail.student.id}}" method="post" style="display:inline">
                <button type="submit">復活</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
